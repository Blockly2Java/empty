name: Update Test Overview
on:
  push:
permissions:
  contents: write
jobs:
  update-overview:
    name: Update README test overview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout coordinator
        uses: actions/checkout@v4
        with:
          path: coordinator

      - name: Derive sub-repo names
        id: repos
        run: |
          EXERCISE="${GITHUB_REPOSITORY##*/}"
          echo "exercise=${EXERCISE}" >> $GITHUB_OUTPUT
          echo "tests=${GITHUB_REPOSITORY_OWNER}/${EXERCISE}_tests" >> $GITHUB_OUTPUT
          echo "solution=${GITHUB_REPOSITORY_OWNER}/${EXERCISE}_solution" >> $GITHUB_OUTPUT
          echo "template=${GITHUB_REPOSITORY_OWNER}/${EXERCISE}_template" >> $GITHUB_OUTPUT

      - name: Checkout tests
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.repos.outputs.tests }}
          token: ${{ github.token }}
          path: tests

      - name: Checkout solution
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.repos.outputs.solution }}
          token: ${{ github.token }}
          path: solution

      - name: Checkout template
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.repos.outputs.template }}
          token: ${{ github.token }}
          path: template

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: tests/pom.xml

      - name: Run solution tests for overview
        continue-on-error: true
        run: cd tests && ./mvnw -B clean test -Psolution

      - name: Save solution reports
        if: always()
        run: |
          mkdir -p coordinator/.ci-reports/solution
          if [ -d tests/target/surefire-reports ]; then
            cp -r tests/target/surefire-reports/. coordinator/.ci-reports/solution/
          fi

      - name: Run template tests for overview
        continue-on-error: true
        run: cd tests && ./mvnw -B clean test -Ptemplate -Dmaven.test.failure.ignore=true

      - name: Save template reports
        if: always()
        run: |
          mkdir -p coordinator/.ci-reports/template
          if [ -d tests/target/surefire-reports ]; then
            cp -r tests/target/surefire-reports/. coordinator/.ci-reports/template/
          fi

      - name: Update README overview section
        if: always()
        run: |
          python3 coordinator/.github/scripts/update_readme_test_overview.py \
            coordinator/README.md \
            coordinator/.ci-reports/solution \
            coordinator/.ci-reports/template

      - name: Commit updated README
        if: always()
        run: |
          cd coordinator
          if git diff --quiet -- README.md; then
            echo "README overview is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(ci): update test overview [skip ci]"
          git push