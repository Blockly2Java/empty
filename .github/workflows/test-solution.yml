name: Solution Tests
on:
  push:
permissions:
  contents: read
jobs:
  test-solution:
    name: Test solution
    runs-on: ubuntu-latest
    steps:
      - name: Derive sub-repo names
        id: repos
        run: |
          EXERCISE="${GITHUB_REPOSITORY##*/}"   # strips 'Org/' prefix
          echo "exercise=${EXERCISE}" >> $GITHUB_OUTPUT
          echo "tests=${GITHUB_REPOSITORY_OWNER}/${EXERCISE}_tests" >> $GITHUB_OUTPUT
          echo "solution=${GITHUB_REPOSITORY_OWNER}/${EXERCISE}_solution" >> $GITHUB_OUTPUT

      - name: Checkout coordinator
        uses: actions/checkout@v4

      - name: Checkout tests
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.repos.outputs.tests }}
          token: ${{ github.token }}
          path: tests

      - name: Checkout solution
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.repos.outputs.solution }}
          token: ${{ github.token }}
          path: solution

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run solution tests
        run: gradle testSolution

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-solution
          path: build/reports/tests/testSolution
          if-no-files-found: ignore
