name: Update Test Overview
on:
  push:
permissions:
  contents: write
jobs:
  update-overview:
    name: Update README test overview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout coordinator
        uses: actions/checkout@v4

      - name: Derive sub-repo names
        id: repos
        run: |
          EXERCISE="${GITHUB_REPOSITORY##*/}"
          echo "exercise=${EXERCISE}" >> $GITHUB_OUTPUT
          echo "tests=${GITHUB_REPOSITORY_OWNER}/${EXERCISE}_tests" >> $GITHUB_OUTPUT
          echo "solution=${GITHUB_REPOSITORY_OWNER}/${EXERCISE}_solution" >> $GITHUB_OUTPUT
          echo "template=${GITHUB_REPOSITORY_OWNER}/${EXERCISE}_template" >> $GITHUB_OUTPUT

      - name: Checkout tests
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.repos.outputs.tests }}
          token: ${{ github.token }}
          path: tests

      - name: Checkout solution
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.repos.outputs.solution }}
          token: ${{ github.token }}
          path: solution

      - name: Checkout template
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.repos.outputs.template }}
          token: ${{ github.token }}
          path: template

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run solution tests for overview
        continue-on-error: true
        run: gradle testSolution

      - name: Save solution reports
        if: always()
        run: |
          mkdir -p .ci-reports/solution
          if [ -d build/reports/tests/testSolution ]; then
            cp -r build/reports/tests/testSolution/. .ci-reports/solution/
          fi

      - name: Run template tests for overview
        continue-on-error: true
        run: gradle testTemplate

      - name: Save template reports
        if: always()
        run: |
          mkdir -p .ci-reports/template
          if [ -d build/reports/tests/testTemplate ]; then
            cp -r build/reports/tests/testTemplate/. .ci-reports/template/
          fi

      - name: Update README overview section
        if: always()
        run: |
          python3 .github/scripts/update_readme_test_overview.py \
            README.md \
            .ci-reports/solution \
            .ci-reports/template

      - name: Commit updated README
        if: always()
        run: |
          if git diff --quiet -- README.md; then
            echo "README overview is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(ci): update test overview [skip ci]"
          git push